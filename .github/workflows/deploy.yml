      - name: Deploy Rondino to cPanel via explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21

          # deploy-staging contains artisan, vendor/, and public/.
          # ./ is the login directory of the dedicated FTP account.
          local-dir: ./deploy-staging/
          server-dir: ./

          dry-run: false
          dangerous-clean-slate: false
          log-level: standard
          timeout: 600000

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/tests/**
            **/release/**
            **/*.sqlite
            **/*.sql
            storage/**
            bootstrap/cache/*.php
            public/storage/**
            public/uploads/**
            **/.ftp-deploy-sync-state.json
